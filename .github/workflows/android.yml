name: Android build & release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege by default; only the release job can write.
permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  RELEASES_REPO: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      # Actions pinned to full commit SHAs (supply-chain hardening).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: |
          flutter create --platforms=android --org com.parallaxnews --project-name parallax_news .
          rm -f test/widget_test.dart
          if [ -f pubspec.lock ]; then flutter pub get --enforce-lockfile; else flutter pub get; fi
          python3 tool/prepare_android.py
          sudo apt-get install -y -qq python3-pil > /dev/null
          python3 tool/recolor_icon.py

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Render screenshots & promo images
        continue-on-error: true
        run: flutter test screenshots/screenshot_test.dart --update-goldens

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: screenshots
          path: |
            screenshots/out/
            pubspec.lock
          if-no-files-found: ignore
          retention-days: 14

      - name: Build signed APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          RUN: ${{ github.run_number }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_B64 secret is missing (see tool/make_keystore.py)"; exit 1
          fi
          mkdir -p ~/.android
          umask 077
          echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
          BASE="https://github.com/${RELEASES_REPO}/releases/latest/download"
          flutter build apk --release \
            --build-name="0.1.${RUN}" \
            --build-number="${RUN}" \
            --dart-define=UPDATE_MANIFEST_URL="${BASE}/latest.json" \
            --dart-define=CATALOG_URL="${BASE}/sources.json"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/parallax-news-0.1.${RUN}.apk"

      # Never leave the signing key on disk for later (third-party) post steps.
      - name: Remove signing key
        if: always()
        run: rm -f ~/.android/debug.keystore

      - name: Write update manifest
        env:
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          n = os.environ["GITHUB_RUN_NUMBER"]
          repo = os.environ["RELEASES_REPO"]
          apk = f"dist/parallax-news-0.1.{n}.apk"
          sha = hashlib.sha256(open(apk, "rb").read()).hexdigest()
          notes = (os.environ.get("NOTES") or "").split("\n")[0][:300]
          manifest = {
              "version": f"0.1.{n}",
              "build": int(n),
              "notes": notes,
              "android": {
                  "url": f"https://github.com/{repo}/releases/download/v0.1.{n}/parallax-news-0.1.{n}.apk",
                  "sha256": sha,
              },
          }
          json.dump(manifest, open("dist/latest.json", "w"), indent=2)
          print(json.dumps(manifest, indent=2))
          PY
          cp assets/sources.json dist/sources.json
          (cd dist && sha256sum * > SHA256SUMS.txt)

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: parallax-news-android
          path: dist/
          retention-days: 14

  # Separate job: the only one holding a write token, and it runs no
  # third-party code - just first-party download + the gh CLI.
  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: parallax-news-android
          path: dist

      - name: Publish release (auto-update source)
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.run_number }}
        run: |
          TAG="v0.1.${RUN}"
          gh release create "$TAG" dist/*.apk dist/latest.json dist/sources.json dist/SHA256SUMS.txt \
            --repo "$RELEASES_REPO" --title "Parallax News $TAG" \
            --notes "Automated test build from ${GITHUB_SHA::7}" --latest
