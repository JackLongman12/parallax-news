# Weekly PRs for outdated GitHub Actions and Dart packages (security fixes
# included). Each PR runs the normal build, so nothing merges untested.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
