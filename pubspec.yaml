name: parallax_news
description: Open-source, bias-aware news aggregator covering the world down to local communities.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ">=1.2.0 <2.0.0"
  xml: ">=6.5.0 <8.0.0"
  provider: ">=6.1.0 <7.0.0"
  shared_preferences: ">=2.3.0 <3.0.0"
  url_launcher: ">=6.3.0 <7.0.0"
  package_info_plus: ">=8.0.0 <10.0.0"
  ota_update: ">=6.0.0 <9.0.0"
  home_widget: ">=0.7.0 <1.0.0"
  share_plus: ">=11.0.0 <13.0.0"
  geolocator: ">=13.0.0 <15.0.0"
  cached_network_image: ">=3.4.0 <4.0.0"
  flutter_cache_manager: ">=3.4.0 <4.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=4.0.0 <7.0.0"

flutter:
  uses-material-design: true
  assets:
    - assets/sources.json
    - assets/fonts/Inter-LICENSE.txt
    - assets/topics/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Italic.ttf
          style: italic
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Inter-Black.ttf
          weight: 900
