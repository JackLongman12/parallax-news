name: parallax_news
description: Open-source, bias-aware news aggregator covering the world down to local communities.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ">=1.2.0 <2.0.0"
  xml: ">=6.5.0 <8.0.0"
  provider: ">=6.1.0 <7.0.0"
  shared_preferences: ">=2.3.0 <3.0.0"
  url_launcher: ">=6.3.0 <7.0.0"
  package_info_plus: ">=8.0.0 <10.0.0"
  ota_update: ">=6.0.0 <9.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=4.0.0 <7.0.0"

flutter:
  uses-material-design: true
  assets:
    - assets/sources.json
