# Separate worker so the account's existing worker(s) are never touched.
name = "parallax-news"
main = "src/index.js"
compatibility_date = "2024-09-23"
workers_dev = true

# Kicks the GitHub crawler every 5 minutes (see scheduled() in index.js).
[triggers]
crons = ["*/5 * * * *"]

[vars]
FEED_URL = "https://github.com/JackLongman12/parallax-news/releases/download/feed/feed.json.gz"

# Last good feed copy + crash reports (see src/index.js).
[[kv_namespaces]]
binding = "STORE"
id = "bb34e79f98224cfbb8e40b853638730f"
